<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soccer Date Input</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="pitch">
    <div class="player" id="player">
      <div class="body"></div>
      <div class="head"></div>
    </div>
    <div class="ball" id="ball"></div>

    <div class="number" style="top: 10px; left: 10px">1</div>
    <div class="number" style="top: 10px; right: 10px">2</div>
    <div class="number" style="bottom: 10px; left: 10px">3</div>
    <div class="number" style="bottom: 10px; right: 10px">4</div>
    <div class="number" style="top: 10px; left: 390px">5</div>
    <div class="number" style="top: 230px; left: 10px">6</div>
    <div class="number" style="top: 230px; right: 10px">7</div>
    <div class="number" style="bottom: 10px; left: 390px">8</div>
    <div class="number" style="top: 120px; left: 10px">9</div>
    <div class="number" style="top: 120px; right: 10px">0</div>

    <div id="overlay">
      <div id="overlay-content">
        <h1 id="overlay-title"></h1>
        <button id="overlay-main"></button>
        <p id="overlay-sub"></p>
      </div>
    </div>
  </div>

  <div id="scoreboard">Enter date (DDMMYYYY):</div>

  <script src="script.js"></script>
</body>
</html>
